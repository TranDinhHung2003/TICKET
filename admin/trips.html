<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý chuyến xe — Quản trị Nhà Xe Thùy Nguyễn</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">

  <aside class="sidebar">
    <a class="sidebar-brand" href="index.html">
      <span class="logo" aria-hidden="true">🚌</span>
      <span>Thùy Nguyễn<small>Bảng quản trị</small></span>
    </a>
    <nav class="sidebar-nav" aria-label="Menu quản trị">
      <p class="group-label">Vận hành</p>
      <a href="index.html">📊 Dashboard</a>
      <a href="trips.html" class="active" aria-current="page">🚌 Quản lý chuyến xe</a>
      <a href="bookings.html">🎫 Quản lý đặt vé</a>
      <p class="group-label">Marketing</p>
      <a href="seo.html">🔍 Quản lý SEO</a>
    </nav>
    <div class="sidebar-foot">
      <a href="../index.html">← Về trang khách hàng</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="sidebar-toggle" aria-label="Mở menu">☰</button>
        <div>
          <h1>Quản lý chuyến xe</h1>
          <span class="sub" id="today-label"></span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-accent" onclick="openTripModal()">＋ Thêm chuyến mới</button>
      </div>
    </header>

    <main class="admin-content">
      <section class="panel" aria-labelledby="trips-title">
        <div class="panel-head">
          <div>
            <h2 id="trips-title">Danh sách chuyến xe <span class="badge blue" id="trip-count">0 chuyến</span></h2>
          </div>
          <div class="filter-bar">
            <input type="search" id="trip-search" placeholder="🔍 Tìm tuyến, biển số, loại xe...">
            <select id="trip-filter-status">
              <option value="all">Tất cả trạng thái</option>
              <option value="active">Đang chạy</option>
              <option value="paused">Tạm dừng</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Tuyến / Loại xe</th>
                <th>Giờ chạy</th>
                <th>Biển số</th>
                <th>Số ghế</th>
                <th>Giá vé</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="trips-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Modal thêm / sửa chuyến -->
<div class="modal-backdrop" id="trip-modal" role="dialog" aria-modal="true" aria-labelledby="trip-modal-title">
  <div class="modal">
    <div class="modal-head">
      <h3 id="trip-modal-title">Thêm chuyến xe mới</h3>
      <button class="modal-close" aria-label="Đóng" onclick="closeModal('trip-modal')">✕</button>
    </div>
    <form id="trip-form" onsubmit="saveTrip(event)">
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full">
            <label for="t-route">Tuyến đường *</label>
            <select id="t-route" required>
              <option>Sài Gòn → Đà Lạt</option>
              <option>Đà Lạt → Sài Gòn</option>
              <option>Sài Gòn → Nha Trang</option>
              <option>Nha Trang → Sài Gòn</option>
              <option>Sài Gòn → Mũi Né</option>
              <option>Sài Gòn → Cần Thơ</option>
            </select>
          </div>
          <div class="field">
            <label for="t-time">Giờ khởi hành *</label>
            <input type="time" id="t-time" value="06:00" required>
          </div>
          <div class="field">
            <label for="t-plate">Biển số xe *</label>
            <input type="text" id="t-plate" placeholder="51B-123.45" required>
          </div>
          <div class="field">
            <label for="t-bus">Loại xe</label>
            <select id="t-bus">
              <option>Limousine 21 giường</option>
              <option>Giường nằm 34 chỗ</option>
              <option>Ghế ngồi 16 chỗ</option>
            </select>
          </div>
          <div class="field">
            <label for="t-seats">Số ghế</label>
            <input type="number" id="t-seats" min="1" max="50" value="21">
          </div>
          <div class="field">
            <label for="t-price">Giá vé (VNĐ) *</label>
            <input type="number" id="t-price" min="0" step="10000" value="290000" required>
          </div>
          <div class="field">
            <label for="t-status">Trạng thái</label>
            <select id="t-status">
              <option value="active">Đang chạy</option>
              <option value="paused">Tạm dừng</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" onclick="closeModal('trip-modal')">Hủy</button>
        <button type="submit" class="btn btn-primary">💾 Lưu chuyến xe</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin.js"></script>
<script src="js/trips.js"></script>
</body>
</html>
