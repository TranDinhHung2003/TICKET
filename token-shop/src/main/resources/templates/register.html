<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký — FB Poster')}"></head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="auth-wrap">
  <div class="panel">
    <h1>Đăng ký</h1>
    <p class="muted">Nhập Gmail — hệ thống <strong>gửi mã OTP về Gmail</strong> để xác minh trước khi tạo tài khoản.</p>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-ok" th:text="${success}"></div>

    <form th:action="@{/register}" method="post" class="stack-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="field">
        <label>Họ tên</label>
        <input name="fullName" required/>
      </div>
      <div class="field">
        <label>Email (Gmail)</label>
        <input type="email" name="email" required/>
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" name="password" required minlength="6"/>
      </div>
      <div class="field">
        <label>Nhập lại mật khẩu</label>
        <input type="password" name="passwordConfirm" required minlength="6"/>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Gửi mã OTP</button>
    </form>
    <p style="margin-top:1.2rem" class="muted">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
  </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
