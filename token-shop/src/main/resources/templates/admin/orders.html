<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đơn hàng — Admin')}"></head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="admin-layout">
  <div th:replace="~{fragments :: admin-nav('orders')}"></div>
  <div class="panel table-wrap">
    <h2 style="font-family:var(--display);margin-top:0">Đơn hàng</h2>
    <table>
      <thead>
      <tr><th>ID</th><th>Tạo lúc</th><th>Người mua</th><th>Gói</th><th>Tiền</th><th>Mã CK</th><th>TT</th><th>Token</th></tr>
      </thead>
      <tbody>
      <tr th:each="o : ${orders}">
        <td th:text="${o.id}"></td>
        <td th:text="${o.createdAt}"></td>
        <td>
          <div th:text="${o.buyerName}"></div>
          <div class="mono muted" th:text="${o.buyerEmail}"></div>
        </td>
        <td th:text="${o.plan.name}"></td>
        <td class="mono" th:text="${#numbers.formatInteger(o.amountVnd, 0, 'COMMA')}"></td>
        <td class="mono" th:text="${o.paymentCode}"></td>
        <td th:text="${o.status}"></td>
        <td class="mono" th:text="${o.issuedToken}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
