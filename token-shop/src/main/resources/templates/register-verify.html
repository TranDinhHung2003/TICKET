<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Xác minh OTP — FB Poster')}"></head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<div class="auth-wrap">
  <div class="panel">
    <h1>Nhập mã OTP</h1>
    <p class="muted">Mã OTP đã gửi về <strong>Gmail</strong> của bạn (kiểm tra cả Spam). Hiệu lực vài phút.</p>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-ok" th:text="${success}"></div>

    <form th:action="@{/register/verify}" method="post" class="stack-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" th:value="${email}" required/>
      </div>
      <div class="field">
        <label>Mã OTP 6 số</label>
        <input name="otp" required pattern="[0-9]{6}" maxlength="6" placeholder="000000"/>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Xác minh &amp; đăng nhập</button>
    </form>

    <form th:action="@{/register/resend}" method="post" style="margin-top:1rem">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="email" th:value="${email}"/>
      <button class="btn btn-ghost" type="submit" style="width:100%">Gửi lại OTP</button>
    </form>
  </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
