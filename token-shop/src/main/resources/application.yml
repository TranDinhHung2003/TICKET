server:
  port: 8080

spring:
  application:
    name: token-shop
  datasource:
    url: jdbc:h2:file:./data/tokenshop;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

app:
  name: Facebook Group Poster
  base-url: ${APP_BASE_URL:http://localhost:8080}
  admin-email: ${ADMIN_EMAIL:admin@local.test}
  admin-password: ${ADMIN_PASSWORD:Admin@123456}
  sepay:
    api-key: ${SEPAY_API_KEY:change-me-sepay-key}
    bank-code: ${SEPAY_BANK:MB}
    account-number: ${SEPAY_ACCOUNT:0910108069999}
    account-name: ${SEPAY_ACCOUNT_NAME:MB BANK}
    payment-prefix: FBPAY
  mail-from: ${MAIL_FROM:noreply@fbposter.local}
  otp-expire-minutes: 10
  order-expire-minutes: 15
